spring.application.name=vynk-backend

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:vynk_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
# Default disabled to guarantee vynk_db is never automatically migrated
spring.flyway.enabled=${VYNK_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0.0
spring.flyway.locations=classpath:db/migration

# VYNK Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${VYNK_MAIL_USERNAME:}
spring.mail.password=${VYNK_MAIL_PASSWORD:}

# SMTP authentication and STARTTLS
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true

# Connection timeouts
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Session and Cookie Security
server.forward-headers-strategy=${VYNK_FORWARD_HEADERS_STRATEGY:none}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${VYNK_SESSION_COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${VYNK_SESSION_COOKIE_SECURE:${vynk.session.cookie.secure:false}}

# Abuse Prevention & Rate Limiting
vynk.ratelimit.enabled=true
vynk.ratelimit.login.max=10
vynk.ratelimit.login.window=60
vynk.ratelimit.register.max=5
vynk.ratelimit.register.window=60
vynk.ratelimit.resend.max=3
vynk.ratelimit.resend.window=60
vynk.ratelimit.forgot.max=3
vynk.ratelimit.forgot.window=60
vynk.ratelimit.reset.max=5
vynk.ratelimit.reset.window=60
vynk.ratelimit.connections.max=20
vynk.ratelimit.connections.window=60
vynk.ratelimit.messaging.max=60
vynk.ratelimit.messaging.window=60
vynk.ratelimit.posts.max=20
vynk.ratelimit.posts.window=60
vynk.ratelimit.reports.max=10
vynk.ratelimit.reports.window=60
vynk.ratelimit.matching.max=30
vynk.ratelimit.matching.window=60
vynk.ratelimit.community.max=10
vynk.ratelimit.community.window=86400
vynk.ratelimit.discussions.max=30
vynk.ratelimit.discussions.window=3600

# Local AI Semantic Inference Service (Phase 4)
vynk.ai.semantic.enabled=true
vynk.ai.semantic.service-url=http://127.0.0.1:8001
vynk.ai.semantic.timeout-ms=1500

# File Upload Configuration (Phase 5)
vynk.files.upload-dir=${user.home}/.vynk/uploads
vynk.files.max-size-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

