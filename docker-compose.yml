version: '3.8'

services:
  # 1. MySQL Database
  mysql:
    image: mysql:8.0
    container_name: vynk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-vynk_db}
      MYSQL_USER: ${DB_USERNAME:-vynk_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - vynk_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vynk-network

  # 2. Python Semantic Inference Microservice (Phase 4)
  inference-service:
    build:
      context: ./inference-service
      dockerfile: Dockerfile
    container_name: vynk-inference
    restart: unless-stopped
    environment:
      VYNK_INFERENCE_HOST: 0.0.0.0
      VYNK_INFERENCE_PORT: 8001
    ports:
      - "${VYNK_INFERENCE_PORT:-8001}:8001"
    networks:
      - vynk-network

  # 3. Spring Boot Backend API (Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vynk-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      inference-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-vynk_db}?serverTimezone=Asia/Kolkata&sslMode=DISABLED&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      VYNK_FLYWAY_ENABLED: ${VYNK_FLYWAY_ENABLED:-true}
      VYNK_MAIL_USERNAME: ${VYNK_MAIL_USERNAME:-}
      VYNK_MAIL_PASSWORD: ${VYNK_MAIL_PASSWORD:-}
      VYNK_SESSION_COOKIE_SECURE: ${VYNK_SESSION_COOKIE_SECURE:-false}
      VYNK_FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: "-Dvynk.ai.semantic.service-url=http://inference-service:8001 -Dvynk.files.upload-dir=/app/uploads -Dvynk.frontend.base-url=${VYNK_FRONTEND_BASE_URL:-http://localhost}"
    ports:
      - "8080:8080"
    volumes:
      - vynk_uploads:/app/uploads
    networks:
      - vynk-network

  # 4. React Vite Frontend (Nginx SPA + Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vynk-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - vynk-network

volumes:
  vynk_mysql_data:
    name: vynk_mysql_data
  vynk_uploads:
    name: vynk_uploads

networks:
  vynk-network:
    name: vynk-network
    driver: bridge
